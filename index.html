<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f9f6e">
<meta name="mobile-web-app-capable" content="yes">
<title>Office Days</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <h1 id="title">My Office Days</h1>
      <p id="sub"></p>
    </div>
    <div class="acts">
      <button class="btn" id="bToday">Today</button>
      <button class="btn icon" id="bSet" aria-label="Settings and backup">&#9776;</button>
    </div>
  </header>

  <section class="stats" aria-live="polite">
    <div class="ring" id="ring"><div class="big"><span id="cnt">0</span><small>of <span id="tgt">8</span></small></div></div>
    <div class="info">
      <p class="msg" id="msg"></p>
      <div class="bar-track" role="progressbar" id="pb" aria-valuemin="0" aria-valuemax="100"><span id="fill"></span></div>
      <div class="chips">
        <span class="chip o">Office <b id="cO">0</b></span>
        <span class="chip w">Home <b id="cH">0</b></span>
        <span class="chip l">Leave <b id="cL">0</b></span>
      </div>
    </div>
  </section>

  <section class="calwrap">
    <div class="nav">
      <button class="btn icon" id="prev" aria-label="Previous month">&#8249;</button>
      <h2 id="mLabel"></h2>
      <button class="btn icon" id="next" aria-label="Next month">&#8250;</button>
    </div>
    <div class="dow" id="dow"></div>
    <div class="cal" id="cal"></div>
    <p class="hint">Tap a day: Office, Home, Leave, then clear. Swipe to change month.</p>
  </section>

  <section class="yearwrap">
    <h3 id="yLabel"></h3>
    <div class="year" id="year"></div>
  </section>
</div>

<div class="sheet" id="set" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="card">
    <div class="row"><h2>Settings</h2><button class="btn icon" id="bClose" aria-label="Close">&#10005;</button></div>
    <div class="fields">
      <label>Your name<input type="text" id="sName" placeholder="e.g. Priya"></label>
      <label>Organization<input type="text" id="sOrg" placeholder="e.g. Acme Ltd"></label>
      <label>Office days required per month<input type="number" id="sTarget" min="1" max="31" inputmode="numeric"></label>
      <label class="chk"><input type="checkbox" id="sSat"> Saturday is a working day</label>
    </div>
    <div class="row tools">
      <button class="btn" id="bExp">Export backup</button>
      <button class="btn" id="bImp">Import backup</button>
      <button class="btn" id="bPrint">Print</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
    <p class="foot">Data is saved only in this browser. Export a backup to move it to another device.</p>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
